[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agun-panjika"
version = "0.1.0"
description = "Harmonised MODIS + VIIRS fire record for Bangladesh (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.12",
  "geopandas>=1.0",
  "shapely>=2.0",
  "requests>=2.31",
  "lightgbm>=4.3",
  "jsonschema>=4.21",
  "scikit-learn>=1.4",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.package-data]
pipeline = ["country.json", "schema/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E401", "E402", "E501", "E702", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
